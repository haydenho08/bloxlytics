name: bloxlytics

# Shared settings for every container built from this repo's Dockerfile.
x-app: &app
  build: .
  image: bloxlytics-app
  profiles: ["app"]
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://bloxlytics:bloxlytics@postgres:5432/bloxlytics
    REDIS_URL: redis://redis:6379/0
    LOG_LEVEL: info
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bloxlytics
      POSTGRES_PASSWORD: bloxlytics
      POSTGRES_DB: bloxlytics
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume: creates the test database
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP. During first-time init Postgres runs a temporary
      # socket-only server, so a socket check would report healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bloxlytics -d bloxlytics"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # AOF persistence: the stream is our queue, so a Redis restart must not lose
    # events the API already answered 202 for. everysec = lose at most ~1s on crash.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------------------
  # The application itself, in containers. Not started by `npm run infra:up`
  # (development runs these on the host with hot reload); start the whole stack
  # with:  docker compose --profile app up --build
  # ---------------------------------------------------------------------------

  migrate:
    <<: *app
    command: ["node", "--import", "tsx", "packages/db/scripts/migrate.ts"]
    restart: "no"

  api:
    <<: *app
    command: ["node", "--import", "tsx", "packages/api/src/main.ts"]
    environment:
      <<: *app-env
      RATE_LIMIT_EVENTS_PER_SEC: ${RATE_LIMIT_EVENTS_PER_SEC:-500}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-2000}
    ports:
      - "8080:8080"
    depends_on: &after-migrate
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Scale out with:  docker compose --profile app up --scale worker=4
  worker:
    <<: *app
    command: ["node", "--import", "tsx", "packages/worker/src/main.ts"]
    depends_on: *after-migrate

  # Dashboard API + the built React app on one port: http://localhost:8082
  dashboard:
    <<: *app
    command: ["node", "--import", "tsx", "packages/dashboard-api/src/main.ts"]
    environment:
      <<: *app-env
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    ports:
      - "8082:8082"
    depends_on: *after-migrate

  # Load generator, run on demand inside the same Docker network:
  #   docker compose --profile bench run --rm loadgen --steps 2000,4000
  loadgen:
    <<: *app
    profiles: ["bench"]
    entrypoint: ["node", "--import", "tsx", "packages/loadgen/src/main.ts", "--url", "http://api:8080"]
    command: []
    depends_on: []
    restart: "no"

volumes:
  pgdata:
  redisdata:
